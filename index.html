<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BobbyAI · Render Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="theme-uva layout-fullscreen">
    <script>
      // Aplica o tema salvo antes do primeiro paint, evitando piscada.
      try {
        var t = localStorage.getItem("bobby_theme");
        document.body.classList.remove("theme-uva", "theme-creme");
        document.body.classList.add("theme-" + (t === "creme" ? "creme" : "uva"));
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
